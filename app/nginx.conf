# nginx sirve los archivos estáticos de la app y hace de proxy hacia la
# API: lo que llega a /api/... se reenvía al servicio api:8000 sin el
# prefijo. Así el navegador habla siempre con el mismo origen y no hace
# falta configurar CORS en la API ni decirle a la app dónde está.
server {
    listen 80;
    root /usr/share/nginx/html;

    # 127.0.0.11 es el DNS interno de Docker. Resolver "api" en cada
    # pedido (y no una sola vez al arrancar) deja a nginx levantar aunque
    # la API todavía no esté, y seguir funcionando si se reinicia con
    # otra IP
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
