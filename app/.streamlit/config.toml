# Tema de la app, con los colores de las diapositivas de la materia
[theme]
base = "light"
primaryColor = "#1d6f68"
backgroundColor = "#f6f4ef"
secondaryBackgroundColor = "#ebe8e0"
textColor = "#1c2226"
# Las fuentes las carga app.py desde Google Fonts; si no hay internet
# el navegador usa la que sigue en la lista
font = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseRadius = "8px"

[client]
# Sin el menú de desarrollador ni el botón de deploy
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
