# Monitoreo y reentrenamiento basado en eventos: cuando llega un lote de
# casas nuevas a datos/lotes/, se revisa si hay drift o si el modelo se
# equivoca más. Si pasa algo, se abre un issue (la alerta) y se reentrena
# un challenger, que se registra como versión nueva en el MLflow
# publicado. El workflow no cambia producción ni el alias champion: el
# issue trae la comparación y una persona decide si correr Promover.
#
# Requiere en el repo (Settings > Secrets and variables > Actions):
#   secretos: MLFLOW_TRACKING_USERNAME, MLFLOW_TRACKING_PASSWORD
#             (usuario github-actions de MLflow)
#   variables: MLFLOW_TRACKING_URI
# El MLflow de producción solo está prendido de 13 a 00 (hora de
# Argentina): fuera de ese horario el workflow falla al conectarse.
name: Reentrenamiento

on:
  push:
    branches: [main]
    paths: ["datos/lotes/**"]
  # También se puede correr a mano desde la pestaña Actions
  workflow_dispatch:

# Solo hace falta abrir y comentar issues: el modelo nuevo no llega al
# repo por acá
permissions:
  contents: read
  issues: write

jobs:
  monitorear:
    runs-on: ubuntu-latest
    env:
      # El cliente de MLflow toma estas tres variables solo
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      # fetch-depth: 0 baja la historia, para ver qué archivos cambiaron
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # uv instala lo mismo que pip pero mucho más rápido, y guarda los
      # paquetes entre corridas: si los requirements no cambiaron, no
      # vuelve a descargar nada
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Instalar dependencias
        run: uv pip install --system -r requirements.txt

      # En un push, solo los lotes que llegaron en ese push; a mano,
      # todos los que hay
      - name: Buscar los lotes nuevos
        id: lotes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            lotes=$(git diff --name-only --diff-filter=AM \
              "${{ github.event.before }}" "${{ github.sha }}" \
              -- 'datos/lotes/*.csv')
          else
            lotes=$(ls datos/lotes/*.csv 2>/dev/null || true)
          fi
          echo "lotes=$(echo $lotes)" >> "$GITHUB_OUTPUT"

      # El reporte de Evidently y las métricas del lote quedan en el
      # experimento "monitoreo" del MLflow publicado
      - name: Detectar drift y degradación
        id: drift
        if: steps.lotes.outputs.lotes != ''
        run: >
          python -m monitoreo.detectar_drift ${{ steps.lotes.outputs.lotes }}
          --resumen resumen_drift.md

      # La alerta: un issue que le llega por mail a quien sigue el repo.
      # La comparación con producción llega después, como comentario
      - name: Abrir un issue de alerta
        id: alerta
        if: steps.drift.outputs.alerta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat resumen_drift.md
            echo "Se está reentrenando un challenger con los lotes nuevos."
            echo "La comparación con producción llega en un comentario."
            echo
            echo "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > alerta.md
          url=$(gh issue create \
            --title "Alerta de monitoreo: ${{ steps.lotes.outputs.lotes }}" \
            --body-file alerta.md)
          echo "issue=$url" >> "$GITHUB_OUTPUT"

      # Registra el challenger como versión nueva de precio-casas, con
      # las métricas de los dos modelos y el reporte de Evidently. No
      # toca el alias champion: promover es una decisión humana
      - name: Reentrenar y registrar el challenger
        id: reentrenar
        if: steps.drift.outputs.alerta == 'true'
        run: >
          python -m entrenamiento.reentrenar
          --resumen resumen_reentrenamiento.md

      - name: Comentar la comparación en el issue
        if: steps.reentrenar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue comment "${{ steps.alerta.outputs.issue }}"
          --body-file resumen_reentrenamiento.md

      # Si el reentrenamiento falla (por ejemplo, MLflow apagado), el
      # issue lo dice en vez de quedar esperando una comparación
      - name: Avisar en el issue que falló el reentrenamiento
        if: failure() && steps.alerta.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue comment "${{ steps.alerta.outputs.issue }}"
          --body "El reentrenamiento falló. Revisar la corrida:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
