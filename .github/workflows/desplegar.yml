# Entrega continua: cada vez que el CI pasa en main, se construyen las
# imágenes de la API y de la app, se suben a ECR y se publican en la EC2.
# La infraestructura está en infra/plantilla.yml.
#
# Requiere en el repo (Settings > Secrets and variables > Actions):
#   secretos: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (usuario
#             tasador-github-actions, que solo puede hacer esto)
#   variables: AWS_REGION, EC2_INSTANCIA, SSM_DOCUMENTO, DOMINIO
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # También se puede correr a mano desde la pestaña Actions
  workflow_dispatch:

# Un despliegue por vez; si llega otro, espera a que termine el anterior
concurrency:
  group: produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    # Solo si el CI terminó bien: con tests en rojo no se despliega
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # El entorno "produccion" deja el historial de despliegues en GitHub
    # y muestra el link a la app
    environment:
      name: produccion
      url: https://tasador.${{ vars.DOMINIO }}
    env:
      # El commit que probó el CI (o el de main, si se corre a mano)
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # Cada imagen se etiqueta con el commit: así se sabe exactamente qué
      # código está corriendo y se puede volver a una versión anterior
      - name: Construir y subir la imagen de la API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/precio-casas-api:${{ env.COMMIT }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Construir y subir la imagen de la app
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/precio-casas-app:${{ env.COMMIT }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # El servidor de MLflow: la imagen oficial más lo que le falta
      # para guardar en S3 y pedir usuario y contraseña
      - name: Construir y subir la imagen de MLflow
        uses: docker/build-push-action@v7
        with:
          context: infra/mlflow
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/precio-casas-mlflow:${{ env.COMMIT }}
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,mode=max,scope=mlflow

      # La EC2 baja las imágenes de este commit y reinicia los contenedores
      - name: Publicar en la EC2
        env:
          INSTANCIA: ${{ vars.EC2_INSTANCIA }}
          DOCUMENTO: ${{ vars.SSM_DOCUMENTO }}
        run: |
          id=$(aws ssm send-command --document-name "$DOCUMENTO" \
            --instance-ids "$INSTANCIA" --parameters "Commit=$COMMIT" \
            --comment "Despliegue de ${COMMIT::7}" \
            --query Command.CommandId --output text)
          for _ in $(seq 60); do
            sleep 10
            estado=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$INSTANCIA" --query Status --output text \
              2>/dev/null || echo Pending)
            case "$estado" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" \
            --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' \
            --output text
          echo "Estado: $estado"
          test "$estado" = Success

      # Que la API publicada responda. La primera vez Caddy tarda unos
      # segundos en sacar el certificado HTTPS
      - name: Probar la API publicada
        run: >
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors
          https://api.${{ vars.DOMINIO }}/salud

      - name: Resumen
        run: |
          {
            echo "### Desplegado ${COMMIT::7}"
            echo "- App: https://tasador.${{ vars.DOMINIO }}"
            echo "- API: https://api.${{ vars.DOMINIO }}/docs"
            echo "- MLflow: https://mlflow.${{ vars.DOMINIO }}"
          } >> "$GITHUB_STEP_SUMMARY"
