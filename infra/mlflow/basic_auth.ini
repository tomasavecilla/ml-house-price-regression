# Configuración de la autenticación de MLflow (--app-name basic-auth).
# Sin esto el servidor usaría una base de usuarios dentro del contenedor y
# se perdería en cada despliegue: acá queda junto a la base de runs.
[mlflow]
# Qué puede hacer un usuario logueado sobre un experimento o modelo que no
# creó ni se le asignó: solo leer. Los usuarios los crea el admin, así que
# "cualquiera" en internet no entra: sin usuario y contraseña todo da 401
default_permission = READ
database_uri = sqlite:////datos/basic_auth.db
admin_username = admin
# La contraseña del admin NO va acá: llega por la variable de entorno
# MLFLOW_AUTH_ADMIN_PASSWORD (el despliegue la lee de SSM Parameter Store).
# Solo se usa para crear al admin la primera vez; después MLflow la ignora,
# y cambiarla en SSM no la cambia en el servidor. Para rotarla: cambiarla
# desde la UI (/account) o con AuthServiceClient.update_user_password, y
# actualizar el parámetro de SSM para que quede igual.
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
