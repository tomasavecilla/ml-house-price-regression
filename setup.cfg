[pycodestyle]
# PEP 8: 79 caracteres para código, 72 para comentarios y docstrings
max-line-length = 79
max-doc-length = 72
exclude = .venv,scratch

[tool:pytest]
testpaths = tests
# Los archivos temporales de los tests van a scratch/, que está en el
# gitignore, en vez de /tmp
addopts = --basetemp=scratch/pytest
