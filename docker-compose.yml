# Levanta la API y la app del tasador juntas:  docker compose up --build
# Cada servicio es un contenedor; compose los conecta en una red propia
# donde se encuentran por nombre (nginx, en la app, reenvía /api/ a
# http://api:8000).
services:
  api:
    # Se construye desde la raíz porque necesita api/ y docker/modelo.joblib
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    # Compose pregunta cada 5 segundos si la API ya responde; la imagen
    # no trae curl, así que se usa Python
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: app/
    # nginx escucha en el 80 adentro del contenedor; afuera queda en
    # localhost:8501
    ports:
      - "8501:80"
    # La app arranca recién cuando la API pasó el healthcheck
    depends_on:
      api:
        condition: service_healthy
